services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-ecommerce}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period:

  api:
    image: ${API_IE
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_NAME: ${DB_NAME:-ecommerce}
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/${DB_NAME:-ecommerce}
      JWT_SECRET: ${JWT_SECRET}
      Stripe_Secret: ${Stripe_Secret}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${CLIENT_IMAGE}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  mongo-data:
