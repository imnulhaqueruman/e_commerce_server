services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-ecommerce}

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5000
      DB_NAME: ${DB_NAME:-ecommerce}
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/${DB_NAME:-ecommerce}
      JWT_SECRET: ${JWT_SECRET}
      Stripe_Secret: ${Stripe_Secret}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "5000:5000"

  web:
    image: ${CLIENT_IMAGE}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  mongo-data:
